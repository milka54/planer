name: planer
description: "Планер — заметки с напоминаниями, гостевой и облачный режим."
publish_to: 'none'

version: 1.3.5+9

environment:
  sdk: ^3.13.5

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  
  # ═══════════════════════════════════════
  # ПАКЕТЫ FIREBASE (добавлены)
  # ═══════════════════════════════════════
  firebase_core: ^3.6.0
  firebase_auth: ^5.3.1
  cloud_firestore: ^5.4.4
  
  # Остальные твои пакеты
  cupertino_icons: ^1.0.8
  shared_preferences: ^2.5.6
  flutter_local_notifications: ^22.3.2
  timezone: ^0.11.2
  intl: ^0.20.3
  fl_chart: ^0.69.0
  image_picker: ^1.2.4
  path_provider: ^2.1.6
  record: ^7.1.2
  audioplayers: ^6.8.1
  url_launcher: ^6.3.1
  http: ^1.2.0
  app_links: ^6.3.2
  speech_to_text: ^7.0.0
  file_picker: ^8.1.4
  archive: ^4.5.2
  workmanager: ^0.10.0
  window_manager: ^0.5.0
  tray_manager: ^0.5.0
  android_alarm_manager_plus: ^5.1.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.1

# ═══════════════════════════════════════
# Настройка генерации иконки приложения
# ═══════════════════════════════════════
flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/icon.png"
  adaptive_icon_background: "#1E3A5F"
  adaptive_icon_foreground: "assets/icon.png"

# ═══════════════════════════════════════
# Секция Flutter (ресурсы приложения)
# ═══════════════════════════════════════
flutter:
  uses-material-design: true

  # Указываем папки с картинками и фонами
  assets:
    - assets/
    - assets/backgrounds/